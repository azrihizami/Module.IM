<style>
:root{--bg:#151A30;--panel:#222A4A;--panel2:#2C3560;--ink:#F2F5FF;--muted:#A3AED0;--gold:#FFD447;--glow:#5BE0F5;--accent:#F29A4A;--danger:#F0646A;--shadow:#0B0E1C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,'Segoe UI',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;background-image:radial-gradient(rgba(91,224,245,.07) 2px,transparent 2px);background-size:32px 32px}
.card{width:min(100%,460px);background:var(--panel);border-radius:28px;padding:30px 26px;box-shadow:0 0 0 4px var(--gold),0 10px 0 4px var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pill{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;letter-spacing:.08em;background:var(--glow);color:#1A1426;padding:6px 14px;border-radius:999px}
h1{margin:0;font-family:Fredoka,'Trebuchet MS',sans-serif;font-size:60px;line-height:.95;color:var(--gold);text-shadow:0 6px 0 var(--shadow)}
p{margin:0;font-weight:700;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:12px;width:100%}
label{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left}
input{height:54px;border-radius:14px;border:2px solid var(--panel2);background:#1B2140;color:var(--ink);padding:0 16px;font:inherit;font-size:20px;font-weight:800;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
button{height:60px;border:0;border-radius:18px;background:var(--accent);color:#1A1426;font-family:Fredoka,'Trebuchet MS',sans-serif;font-weight:700;font-size:24px;box-shadow:0 6px 0 var(--shadow);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--danger);font-weight:800;min-height:1.4em}
small{color:var(--muted);font-weight:700;font-size:12px}
</style></head><body>
