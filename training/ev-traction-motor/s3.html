(async function(){
var S=CFG.store,US=S+":u",TS=S+":t",body=document.body;
var g=function(st,k){try{return st.getItem(k);}catch(e){return null;}},put=function(st,k,v){try{st.setItem(k,v);}catch(e){}};
function clear(){[S,US,TS].forEach(function(k){try{sessionStorage.removeItem(k);localStorage.removeItem(k);}catch(e){}});}
var u8=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
var b64=function(b){var s="",a=new Uint8Array(b);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
var hex=function(b){return Array.from(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0");}).join("");};
async function dec(raw,w){var p=w.split(":"),k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(p[0])},k,u8(p[1])));}
async function uid(n){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("motoreka|"+CFG.course+"|"+n.trim().toLowerCase()))).slice(0,32);}
async function users(){var r;try{r=await fetch("users.json?v="+Date.now(),{cache:"no-store"});}catch(e){throw new Error("net");}if(!r.ok)throw new Error("net");return r.json();}
async function show(K){var h=new TextDecoder().decode(await dec(K,CFG.page)).replace("%3Csvg viewBox=","%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox=");var fi=CFG.fb?h.indexOf(">Downloads</a></nav>"):-1;if(fi>0&&h.indexOf('href="feedback/"')<0)h=h.slice(0,fi+14)+'<a href="feedback/">Feedback</a>'+h.slice(fi+14);put(sessionStorage,S,b64(K));document.open();document.write(h);document.close();}
var err=document.getElementById("err");
// Licence end date: x is the account's last valid day (YYYY-MM-DD), wrapped with the account key U.
async function ended(U,e){if(!e.x)return "";var d=new TextDecoder().decode(await dec(U,e.x));return new Date().toLocaleDateString("en-CA")>d?d:"";}
function over(d){return "Your access ended on "+d+". Ask your facilitator if your licence has been renewed.";}
function msg(t){err.textContent=t;body.style.visibility="";}
if(!window.crypto||!crypto.subtle){msg("This browser cannot open the course. Use a current Chrome, Edge, Firefox or Safari over https.");return;}
try{localStorage.removeItem(S);}catch(e){}
var who=null;try{who=JSON.parse(g(sessionStorage,US)||g(localStorage,US)||"null");}catch(e){}
if(who&&who.id&&who.U){
 body.style.visibility="hidden";
 if(document.readyState!=="complete")await new Promise(function(r){window.addEventListener("load",r);});
 var ck=g(sessionStorage,S),t=+(g(sessionStorage,TS)||0);
 if(ck&&Date.now()-t<6e5){try{await show(u8(ck));return;}catch(e){}}
 try{
  var K;
  try{var db=await users(),e=db.users.find(function(x){return x.id===who.id;});
   if(!e||!e.k){clear();msg("Your access has changed. Sign in again, or ask your facilitator.");return;}
   var xe=await ended(u8(who.U),e);if(xe){clear();msg(over(xe));return;}
   K=await dec(u8(who.U),e.k);}
  catch(x){if(x.message==="net"&&ck)K=u8(ck);else throw x;}
  put(sessionStorage,US,JSON.stringify(who));put(sessionStorage,TS,String(Date.now()));await show(K);return;
 }catch(x){clear();msg("Please sign in again.");return;}
}
document.getElementById("f").addEventListener("submit",async function(ev){ev.preventDefault();var btn=document.getElementById("go");btn.disabled=true;err.textContent="Checking…";
 var un=document.getElementById("un").value,pw=document.getElementById("pw").value;
 try{var db=await users();}catch(x){btn.disabled=false;err.textContent="The course could not be reached. Check the connection and try again.";return;}
 var id=await uid(un),e=db.users.find(function(x){return x.id===id;});
 if(e&&!e.w){btn.disabled=false;err.textContent="This account is not active. Ask your facilitator.";return;}
 try{if(!e)throw 0;
  var m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var kek=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(e.s),iterations:db.iter,hash:"SHA-256"},m,256));
  var U=await dec(kek,e.w);
 }catch(x){btn.disabled=false;err.textContent=CFG.bad;return;}
 try{var xe=await ended(U,e);if(xe){btn.disabled=false;err.textContent=over(xe);return;}
  var K=await dec(U,e.k),name=new TextDecoder().decode(await dec(U,e.n));
  var w=JSON.stringify({id:e.id,U:b64(U),n:name,r:e.role});
  put(sessionStorage,US,w);put(sessionStorage,TS,String(Date.now()));if(document.getElementById("rm").checked)put(localStorage,US,w);
  await show(K);
 }catch(x){btn.disabled=false;err.textContent=CFG.bad;}
});
})();
