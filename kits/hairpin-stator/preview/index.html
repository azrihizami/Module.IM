<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hairpin Kit Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#101B25; --graphite:#2C4453; --steel:#5F8FA8; --copper:#C0703A; --paper:#F5F3EF;
  --bg:#F5F3EF; --bench:#ECE9E3; --fg:#101B25; --muted:#5d6b75; --line:#d8d4cc; --card:#fff;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{background:var(--navy);color:var(--paper);display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 16px}
.brand h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap}
.brand small{display:block;font:500 10.5px/1.2 var(--f-mono);color:#9DB6C6;letter-spacing:.06em;text-transform:uppercase}
nav.kits{display:flex;gap:4px;margin-left:auto}
nav.kits button{font:500 12.5px var(--f-body);color:#C9D6DF;background:transparent;border:1px solid #2C4453;border-radius:3px;padding:6px 11px;cursor:pointer}
nav.kits button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--navy)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.bench{position:relative;background:var(--bench);min-height:0;overflow:hidden}
.bench canvas{display:block;width:100%;height:100%;touch-action:none}
.tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);display:none}
.tag .box{background:var(--navy);color:#fff;font:600 13px var(--f-body);padding:5px 10px;border-radius:6px;border:2px solid #E9A15C;white-space:nowrap}
.tag .stem{width:2px;height:28px;background:#E9A15C;margin:0 auto}
.tag .dot{width:10px;height:10px;border-radius:50%;background:#E9A15C;margin:-4px auto 0}
.hud{position:absolute;left:14px;top:12px;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.views{position:absolute;right:12px;top:10px;display:flex;gap:4px}
.views button,.ctrl button,.ctrl select{font:500 12px var(--f-body);background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer;color:var(--fg)}
.views button:hover,.ctrl button:hover{border-color:var(--steel)}
.ctrl{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .main{display:flex;gap:4px}
.ctrl button.play{background:var(--navy);color:#fff;border-color:var(--navy);min-width:64px}
.ctrl input[type=range]{flex:1;min-width:160px;accent-color:var(--copper)}
.ctrl label{font:12px var(--f-body);color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap}
.time{font:12px var(--f-mono);color:var(--muted);min-width:84px;text-align:right}
aside{background:var(--paper);border-left:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr;min-height:0}
.stepcard{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.stepcard .num{font:600 11px var(--f-mono);color:var(--copper);letter-spacing:.06em;text-transform:uppercase}
.stepcard h2{font-size:17px;margin:2px 0 6px;line-height:1.25}
.stepcard p{margin:0;font-size:13px;color:#24323d}
.parts{padding:10px 16px;border-bottom:1px solid var(--line)}
.parts h3,.steps h3{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pcell{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center;cursor:default}
.pcell img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.pcell b{display:block;font-size:12.5px}
.pcell span{font:600 12px var(--f-mono);color:var(--copper)}
.pcell.active{border:2px solid #E9A15C;padding:3px}
.pcell.tpu b{color:#6b6e73}
.empty{font-size:12.5px;color:var(--muted)}
.steps{padding:10px 8px 10px 16px;overflow:auto;min-height:0}
.steps ol{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.steps li:hover{background:#e7e3db}
.steps li.cur{background:var(--navy);color:#fff}
.steps li.done{color:var(--muted)}
.steps li .n{font:600 12px var(--f-mono);min-width:22px;color:var(--copper)}
.steps li.lock{cursor:default;color:#8a949b}.steps li.lock:hover{background:none}.steps li.lock .n{color:#a9b3ba}
.steps li.lock svg{flex:none;margin-left:auto;align-self:center}
.lockcard{margin:10px 8px 4px 0;padding:12px;border-radius:6px;background:var(--navy);color:var(--paper);display:grid;gap:8px}
.lockcard b{font-size:14px}.lockcard p{margin:0;font-size:12.5px;color:#C9D6DF}
.lockcard a{justify-self:start;font:600 12.5px var(--f-body);color:var(--navy);background:var(--paper);border-radius:3px;padding:6px 11px;text-decoration:none}
.steps li.cur .n{color:#E9A15C}
.info{position:absolute;right:12px;top:48px;width:270px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:none;box-shadow:0 4px 16px rgba(16,27,37,.12)}
.info img{width:64px;height:64px;float:left;margin-right:8px;object-fit:contain}
.info b{font-size:15px}
.info p{margin:4px 0 0;font-size:12.5px;color:#24323d;clear:both}
.info .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
footer{background:var(--navy);color:#9DB6C6;font:11.5px var(--f-mono);display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;padding:6px 16px}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px var(--f-mono);color:var(--muted)}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .bench{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .steps{max-height:none}
}
</style>

<body>
<div class="app">
<header>
  <div class="brand"><h1>Hairpin Kit Viewer</h1><small>Motoreka · Hairpin Stator Kit</small></div>
  <nav class="kits" id="kits"><button data-k="full" aria-pressed="true">Full kit</button><button data-k="test" aria-pressed="false">Test set</button></nav>
</header>
<main>
  <section class="bench" id="bench">
    <div class="load" id="load">Loading the kit…</div>
    <div class="hud" id="hud"></div>
    <div class="views">
      <button id="vCrown" title="Look at the crown face">Crown</button>
      <button id="vWeld" title="Look at the weld face">Weld</button>
      <button id="vSide" title="Side view">Side</button>
      <button id="vFit" title="Reset the view">Reset</button>
    </div>
    <div class="tag" id="tag"><div class="box" id="tagtxt"></div><div class="stem"></div><div class="dot"></div></div>
    <div class="info" id="info"><button class="x" id="infox" aria-label="Close">×</button><img id="infoimg" alt=""><b id="inforef"></b><div id="infolab" style="font-size:12px;color:#5d6b75"></div><p id="infotxt"></p></div>
    <div class="ctrl">
      <div class="main">
        <button id="bPrevStep" title="Previous step (←)">⏮</button>
        <button id="bPrevPiece" title="Previous piece (,)">‹</button>
        <button id="bPlay" class="play" title="Play / pause (space)">Play</button>
        <button id="bNextPiece" title="Next piece (.)">›</button>
        <button id="bNextStep" title="Next step (→)">⏭</button>
      </div>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position in the step">
      <span class="time" id="time"></span>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <label><input type="checkbox" id="cAuto" checked>auto-next</label>
      <label><input type="checkbox" id="cFollow" checked>follow</label>
      <label><input type="checkbox" id="cTags" checked>tags</label>
      <label><input type="checkbox" id="cPhase">phase colours</label>
    </div>
  </section>
  <aside>
    <div class="stepcard"><div class="num" id="snum"></div><h2 id="stitle"></h2><p id="stext"></p></div>
    <div class="parts"><h3>Parts for this step</h3><div class="pgrid" id="pgrid"></div></div>
    <div class="steps"><h3>Steps</h3><ol id="slist"></ol></div>
  </aside>
</main>
<footer><span>Motoreka is a product of UMPSA, developed at EMDLab</span><span>Drag to turn · scroll to zoom · click a part for its reference</span></footer>
</div>

const $ = id => document.getElementById(id);
const bench = $('bench');

// ---------------------------------------------------------------- three.js scene (z up)
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
bench.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xECE9E3);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 6000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.15));
const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(300, -400, 600); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.6); d2.position.set(-500, 300, -200); scene.add(d2);

function b64(s, Type){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Type(u.buffer); }
const GEOM = DATA.meshes.map(m => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(m.pos, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(m.idx, m.i32 ? Uint32Array : Uint16Array), 1));
  g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
});
const PH = {A:'#c8312a', B:'#e3ad1c', C:'#2a64c4'};
const PHN = {A:'U', B:'V', C:'W'};

// ---------------------------------------------------------------- kit state
let K = null, kitKey = 'full', meshes = [], pivotG = null, innerG = null, worldG = null;
let stepIdx = 0, t = 0, playing = false, follow = true, sched = [], dur = 10, pauseT = 0;
let placedAt = [];   // instance -> [stepIdx, pieceIdx]
let camOverride = false;   // the camera was set by a step's own view (the coupon)
const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };

function buildKit(key){
  kitKey = key; K = DATA.kits[key];
  if (worldG) scene.remove(worldG);
  worldG = new THREE.Group(); scene.add(worldG);
  pivotG = new THREE.Group(); pivotG.position.fromArray(K.pivot); worldG.add(pivotG);
  innerG = new THREE.Group(); innerG.position.set(-K.pivot[0], -K.pivot[1], -K.pivot[2]); pivotG.add(innerG);
  meshes = K.inst.map((it, i) => {
    const mat = new THREE.MeshStandardMaterial({color: it.c, roughness: .55, metalness: it.c === '#b8682f' ? .25 : .05, flatShading: true, transparent: false});
    const m = new THREE.Mesh(GEOM[it.m], mat);
    m.matrixAutoUpdate = false;
    m.userData = {i, base: new THREE.Matrix4().fromArray(it.M), col: new THREE.Color(it.c)};
    m.matrix.copy(m.userData.base);
    (it.f === 'world' ? worldG : innerG).add(m);
    return m;
  });
  placedAt = K.inst.map(() => null);
  K.steps.forEach((s, si) => { if (s.ghost) return; s.pieces.forEach((p, pi) => { if (placedAt[p.i] === null) placedAt[p.i] = [si, pi]; }); });
  // step list
  $('slist').innerHTML = K.steps.map((s, i) => `<li data-i="${i}"><span class="n">${s.n}</span><span>${s.title}</span></li>`).join('');
  $('slist').querySelectorAll('li').forEach(li => li.onclick = () => goStep(+li.dataset.i));
  if (K.locked && K.locked.length) {
    const lockSvg = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
    $('slist').insertAdjacentHTML('beforeend', K.locked.map(s => `<li class="lock" aria-disabled="true"><span class="n">${s.n}</span><span>${s.title}</span>${lockSvg}</li>`).join(''));
    const M = DATA.meta || {};
    $('slist').insertAdjacentHTML('afterend', `<div class="lockcard"><b>Steps ${K.steps.length + 1} to ${M.total} open with the kit</b><p>Kit owners sign in with the kit number and the access code in the box, and play every step.</p>${M.lockHref ? `<a href="${M.lockHref}" target="_top">See the kit</a>` : ''}</div>`);
  }
  document.querySelectorAll('#kits button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === key));
  camOverride = false;
  fitView();
  goStep(0);
}

function schedule(s){
  const n = s.pieces.length, out = [];
  if (s.flipstep) { s.pieces.forEach(p => out.push((p.at || .75) * 7.0)); return {st: out, fly: .9, dur: 8.0}; }
  if (s.hl && s.hl.length && !n) {
    const D = s.hlseq ? Math.max(6, s.hl.length * 0.09) : 5;
    return {st: [], fly: .9, dur: D};
  }
  let tt = .4; const slow = s.slow || 0;
  const fast = slow ? .36 : Math.min(1.1, 9 / Math.max(n, 1));
  for (let i = 0; i < n; i++) { out.push(tt); tt += (slow && (i < slow - 1 || i >= n - slow - 1)) ? 1.3 : fast; }
  const fly = .9;
  return {st: out, fly, dur: (n ? out[n - 1] : 0) + fly + .8};
}

function goStep(i, keepT){
  stepIdx = Math.max(0, Math.min(K.steps.length - 1, i));
  const s = K.steps[stepIdx];
  const sc = schedule(s); sched = sc.st; dur = sc.dur; s._fly = sc.fly;
  if (!keepT) t = 0;
  pauseT = 0;
  $('snum').textContent = `Step ${s.n} of ${(DATA.meta && DATA.meta.total) || K.steps.length} · ${K.name}`;
  $('stitle').textContent = s.title;
  $('stext').innerHTML = s.text || '';
  $('slist').querySelectorAll('li').forEach((li, j) => { li.classList.toggle('cur', j === stepIdx); li.classList.toggle('done', j < stepIdx); });
  const cur = $('slist').children[stepIdx]; if (cur) cur.scrollIntoView({block: 'nearest'});
  drawParts(null);
  if (s.cam) { setCam(s.cam.target, s.cam.dist, null, 38); camOverride = true; }
  else if (camOverride) { camOverride = false; fitView(); }
  update();
}

function drawParts(active){
  const s = K.steps[stepIdx];
  const g = $('pgrid');
  if (!s.parts.length) { g.innerHTML = '<div class="empty">No new parts: check and record.</div>'; g._key = ''; return; }
  const key = stepIdx + '|' + active;
  if (g._key === key) return;
  g._key = key;
  g.innerHTML = s.parts.map(([r, q]) => `<div class="pcell${r === active ? ' active' : ''}${r.endsWith('TPU') ? ' tpu' : ''}" title="${K.names[r] || r}"><img alt="${r}" src="${K.thumbs[r] || ''}"><b>${r}</b><span>×${q}</span></div>`).join('');
}

// ---------------------------------------------------------------- per-frame state
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), axisV = new THREE.Vector3();
function flipAngle(){
  const s = K.steps[stepIdx];
  if (s.flipstep) {
    const f = ease((t / dur - .15) / .45);
    return Math.PI * (1 + f);         // 180 -> 360 degrees
  }
  return s.flip === 180 ? Math.PI : 0;
}
function liftNow(){
  const s = K.steps[stepIdx];
  if (!s.flipstep) return 0;
  const u = t / dur; return 120 * ease((u - .05) / .12) * (1 - ease((u - .6) / .12));
}

let currentPiece = -1;
function update(){
  const s = K.steps[stepIdx];
  axisV.fromArray(K.axis).normalize();
  pivotG.quaternion.setFromAxisAngle(axisV, flipAngle());
  pivotG.position.set(K.pivot[0], K.pivot[1], K.pivot[2] + liftNow());
  pivotG.updateMatrixWorld(true);
  const invQ = pivotG.quaternion.clone().invert();
  const ghost = new Set(s.ghost ? s.pieces.map(p => p.i) : []);
  const hlMap = new Map();
  if (s.hl && s.hl.length) {
    const nOn = s.hlseq ? Math.floor(s.hl.length * Math.min(1, t / (dur * .92))) : s.hl.length;
    const blink = !s.hlseq && (Math.floor(t * 2.5) % 2 === 0 || t > dur * .7);
    s.hl.slice(0, nOn).forEach(h => { if (s.hlseq || blink) hlMap.set(h.i, h.c); });
  }
  const phaseOn = $('cPhase').checked;
  currentPiece = -1;
  let curStart = -1;
  meshes.forEach((m, i) => {
    const it = K.inst[i];
    let vis = false, off = 0, dir = null;
    if (it.only) vis = it.only === s.n;
    const pa = placedAt[i];
    if (!it.only) {
      if (ghost.has(i)) vis = true;
      else if (pa && pa[0] < stepIdx) vis = true;
      else if (pa && pa[0] === stepIdx) {
        const st0 = sched[pa[1]];
        if (t >= st0) { vis = true; const f = ease((t - st0) / s._fly); const p = s.pieces[pa[1]]; off = (1 - f) * p.dist; dir = p.d;
          if (st0 >= curStart) { curStart = st0; currentPiece = i; } }
      }
    } else if (vis && pa && pa[0] === stepIdx) {
      const st0 = sched[pa[1]];
      if (t < st0) vis = false; else { const f = ease((t - st0) / s._fly); const p = s.pieces[pa[1]]; off = (1 - f) * p.dist; dir = p.d;
        if (st0 >= curStart) { curStart = st0; currentPiece = i; } }
    }
    if (it.until && +s.n >= +it.until && !(s.flipstep && s.n === it.until && t < dur * .1)) vis = false;
    m.visible = vis;
    if (!vis) return;
    m.matrix.copy(m.userData.base);
    if (off) {
      tmpV.fromArray(dir).multiplyScalar(off);
      if (it.f !== 'world') tmpV.applyQuaternion(invQ);
      m.matrix.premultiply(new THREE.Matrix4().makeTranslation(tmpV.x, tmpV.y, tmpV.z));
    }
    const mat = m.material;
    let c = m.userData.col;
    if (phaseOn && it.ph && !it.ref.startsWith('LN')) c = new THREE.Color(PH[it.ph]);
    if (hlMap.has(i)) c = new THREE.Color(hlMap.get(i));
    mat.color.copy(c);
    const g = ghost.has(i);
    mat.transparent = g; mat.opacity = g ? .35 : 1; mat.depthWrite = !g;
    mat.emissive.setHex(0x000000);
  });
  if (currentPiece >= 0) {
    const f = (t - curStart) / s._fly;
    if (f < 2.2) meshes[currentPiece].material.emissive.setHex(0x5a2a00);
    drawParts(K.inst[currentPiece].ref);
  } else drawParts(null);
  $('scrub').value = Math.round(1000 * t / dur);
  $('time').textContent = `${t.toFixed(1)} / ${dur.toFixed(1)} s`;
  $('hud').textContent = `${K.name} · step ${s.n}` + (s.flip === 180 && !s.flipstep ? ' · crown face up' : ' · weld face up');
  dirty = true;
}

// ---------------------------------------------------------------- camera
function setCam(target, dist, azDeg, elDeg){
  const tg = new THREE.Vector3().fromArray(target);
  const cur = camera.position.clone().sub(controls.target);
  let az = azDeg === null || azDeg === undefined ? Math.atan2(cur.y, cur.x) : azDeg * Math.PI / 180;
  const el = (elDeg ?? 30) * Math.PI / 180;
  controls.target.copy(tg);
  camera.position.set(tg.x + dist * Math.cos(el) * Math.cos(az), tg.y + dist * Math.cos(el) * Math.sin(az), tg.z + dist * Math.sin(el));
  controls.update(); dirty = true;
}
function fitView(){
  const az = kitKey === 'test' ? Math.atan2(K.target[1], K.target[0]) * 180 / Math.PI + 200 : -60;
  setCam(K.target, K.dist, az, 30);
}
$('vFit').onclick = () => { follow = $('cFollow').checked = true; fitView(); };
$('vCrown').onclick = () => { const s = K.steps[stepIdx]; setCam(K.target, K.dist, null, s.flip === 180 && !s.flipstep ? 68 : -60); };
$('vWeld').onclick = () => { const s = K.steps[stepIdx]; setCam(K.target, K.dist, null, s.flip === 180 && !s.flipstep ? -60 : 68); };
$('vSide').onclick = () => setCam(K.target, K.dist, null, 4);
controls.addEventListener('start', () => { if (playing) { follow = false; $('cFollow').checked = false; } });
controls.addEventListener('change', () => dirty = true);
$('cFollow').onchange = e => follow = e.target.checked;

function followCam(dt){
  if (!follow || !playing || currentPiece < 0 || K.steps[stepIdx].cam) return;
  const m = meshes[currentPiece];
  const c = m.geometry.boundingSphere.center.clone().applyMatrix4(m.matrixWorld);
  const want = Math.atan2(c.y - controls.target.y, c.x - controls.target.x) + (kitKey === 'test' ? 0.9 : 0.35);
  const off = camera.position.clone().sub(controls.target);
  const r = Math.hypot(off.x, off.y);
  let az = Math.atan2(off.y, off.x);
  let d = ((want - az + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  az += d * Math.min(1, dt * 1.6);
  camera.position.set(controls.target.x + r * Math.cos(az), controls.target.y + r * Math.sin(az), camera.position.z);
  dirty = true;
}

// ---------------------------------------------------------------- tag and picking
function placeTag(){
  const tag = $('tag');
  if (!$('cTags').checked || currentPiece < 0) { tag.style.display = 'none'; return; }
  const m = meshes[currentPiece];
  const c = m.geometry.boundingSphere.center.clone().applyMatrix4(m.matrixWorld).project(camera);
  if (c.z > 1) { tag.style.display = 'none'; return; }
  const r = renderer.domElement.getBoundingClientRect();
  tag.style.display = 'block';
  tag.style.left = ((c.x + 1) / 2 * r.width) + 'px';
  tag.style.top = ((1 - c.y) / 2 * r.height) + 'px';
  $('tagtxt').textContent = K.inst[currentPiece].lab;
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => downXY = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible), false)[0];
  if (!hit) { $('info').style.display = 'none'; return; }
  const it = K.inst[hit.object.userData.i];
  $('inforef').textContent = it.ref;
  $('infolab').textContent = it.lab !== it.ref ? it.lab : '';
  $('infotxt').textContent = it.info || '';
  $('infoimg').src = K.thumbs[it.ref] || '';
  $('info').style.display = 'block';
});
$('infox').onclick = () => $('info').style.display = 'none';

// ---------------------------------------------------------------- controls
function setPlay(p){ playing = p; $('bPlay').textContent = p ? 'Pause' : 'Play'; if (p && t >= dur) { if (stepIdx < K.steps.length - 1) goStep(stepIdx + 1); else t = 0; } }
$('bPlay').onclick = () => setPlay(!playing);
$('bNextStep').onclick = () => goStep(stepIdx + 1);
$('bPrevStep').onclick = () => goStep(t > 1 ? stepIdx : stepIdx - 1);
function pieceJump(dirn){
  const s = K.steps[stepIdx];
  const ends = sched.map(x => x + s._fly);
  if (dirn > 0) { const nx = ends.find(e => e > t + 1e-3); if (nx !== undefined) t = nx; else { goStep(stepIdx + 1); return; } }
  else { const pv = [...ends].reverse().find(e => e < t - 1e-3); t = pv !== undefined ? pv : 0; }
  setPlay(false); update();
}
$('bNextPiece').onclick = () => pieceJump(1);
$('bPrevPiece').onclick = () => pieceJump(-1);
$('scrub').oninput = e => { t = dur * e.target.value / 1000; setPlay(false); update(); };
$('cPhase').onchange = update; $('cTags').onchange = () => dirty = true;
document.querySelectorAll('#kits button').forEach(b => b.onclick = () => { setPlay(false); buildKit(b.dataset.k); });
if (!DATA.kits.test) $('kits').style.display = 'none';
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') goStep(stepIdx + 1);
  else if (e.key === 'ArrowLeft') goStep(stepIdx - 1);
  else if (e.key === '.') pieceJump(1);
  else if (e.key === ',') pieceJump(-1);
});

// ---------------------------------------------------------------- loop
let dirty = true, last = performance.now();
function resize(){ const r = bench.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix(); dirty = true; }
new ResizeObserver(resize).observe(bench);
function loop(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) {
    if (t < dur) { t = Math.min(dur, t + dt * +$('speed').value); update(); }
    else if ($('cAuto').checked && stepIdx < K.steps.length - 1) { pauseT += dt; if (pauseT > 1.0) goStep(stepIdx + 1); }
    else setPlay(false);
    followCam(dt);
  }
  if (controls.update()) dirty = true;
  if (dirty) { renderer.render(scene, camera); placeTag(); dirty = false; }
  requestAnimationFrame(loop);
}
$('load').remove();
resize();
buildKit('full');
requestAnimationFrame(loop);
</script>
</body>
</html>
